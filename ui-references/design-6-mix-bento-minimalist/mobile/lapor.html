<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design 6 — Mix | Mobile Lapor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.14"></script>
<script src="../tailwind-config.js"></script>
<link rel="stylesheet" href="../tokens.css">
<style>body{background:#0e0f13;}</style>
</head>
<body class="min-h-screen flex items-center justify-center p-8">
<p class="fixed top-4 left-5 text-[12px] text-muted">Design 6 — Mix (mobile, navigasi nyata antar halaman)</p>

<div class="w-[360px] h-[760px] bg-canvas rounded-[34px] border border-line shadow-2xl overflow-hidden flex flex-col relative">
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[120px] h-[22px] bg-black rounded-b-2xl z-10"></div>
  <div class="h-10 flex items-end justify-between px-6 pb-1.5 text-[11px] text-muted"><span>09:41</span><span class="font-medium text-ink">Sigap Buronan</span><span>&#9679;&#9679;&#9679;</span></div>

  <div class="flex-1 overflow-y-auto px-4 pb-2">
    <div class="pt-2 pb-3"><div class="text-[18px] font-semibold">Lapor Temuan</div><div class="text-[12px] text-muted">Bantu kami menjaga wilayah Anda</div></div>

    <div class="border border-dashed border-line rounded-xl h-[120px] flex flex-col items-center justify-center gap-1.5 text-muted bg-surface mb-3.5">
      <i data-lucide="camera" class="w-5 h-5"></i>
      <span class="text-[12.5px] font-medium">Ambil foto / unggah dari galeri</span>
    </div>

    <label class="block text-[11.5px] font-medium text-muted mb-1.5">Lokasi</label>
    <div class="flex items-center gap-2 border-b border-line py-2.5 mb-3.5 text-[13px]">
      <i data-lucide="map-pin" class="w-4 h-4 text-muted"></i>Jl. Sudirman Kav. 25, Jakarta Selatan
    </div>

    <label class="block text-[11.5px] font-medium text-muted mb-1.5">Deskripsi singkat</label>
    <textarea rows="3" placeholder="Ciri-ciri, waktu melihat, dll." class="w-full border-b border-line py-2.5 text-[13px] mb-3.5 text-ink placeholder:text-muted bg-transparent"></textarea>

    <div class="flex items-center justify-between border-t border-b border-line py-3 mb-4">
      <span class="text-[13px] font-medium">Kirim sebagai anonim</span>
      <div class="toggle"></div>
    </div>

    <button class="w-full bg-amber text-canvas font-semibold text-[13.5px] py-3.5 rounded-xl flex items-center justify-center gap-2"><i data-lucide="send" class="w-4 h-4"></i>Kirim Laporan</button>
  </div>

  <nav class="grid grid-cols-4 border-t border-line bg-surface px-2 py-2.5">
    <a href="home.html" class="flex flex-col items-center gap-1 text-muted"><i data-lucide="layout-grid" class="w-5 h-5"></i><span class="text-[10px]">Home</span></a>
    <a href="lapor.html" class="flex flex-col items-center gap-1 text-amber"><i data-lucide="flag" class="w-5 h-5"></i><span class="text-[10px] font-medium">Lapor</span></a>
    <a href="status.html" class="flex flex-col items-center gap-1 text-muted"><i data-lucide="list-checks" class="w-5 h-5"></i><span class="text-[10px]">Status</span></a>
    <a href="profil.html" class="flex flex-col items-center gap-1 text-muted"><i data-lucide="user-round" class="w-5 h-5"></i><span class="text-[10px]">Profil</span></a>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
