services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: buronan
      POSTGRES_PASSWORD: buronan_dev_password
      POSTGRES_DB: buronan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # MinIO's Docker Hub / quay.io images now require a login (pull access denied for anonymous
  # pulls as of late 2024/2025). For local dev we swap in Adobe's S3Mock — a permissive,
  # S3-API-compatible test double that still works with the `minio` SDK client unchanged.
  # Production should point MINIO_* env vars at a real self-hosted MinIO (installed from
  # https://min.io/download, not Docker Hub) or a managed S3-compatible bucket.
  #
  # By default S3Mock keeps every uploaded object in memory/container-FS only and wipes it on
  # shutdown — every evidence/face photo already uploaded goes permanently 404 the moment this
  # container restarts (observed directly: a routine restart mid-session turned every existing
  # photo across the dashboard into a broken image). retainFilesOnExit + root + the volume below
  # make it persist objects to a real volume across restarts, same as production MinIO would.
  minio:
    image: adobe/s3mock:latest
    restart: unless-stopped
    environment:
      initialBuckets: evidence
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
    volumes:
      - minio_data:/s3mockroot
    ports:
      - "9000:9090"
      - "9001:9191"

  # RTSP->HLS relay for the web dashboard's "Mode Fokus" live view. apps/api registers a
  # path per CCTV feed via the API port (9997); the web <video> player fetches HLS segments
  # from the HLS port (8888). sourceOnDemand (set per-path, not here) means MediaMTX only
  # pulls from the camera while someone is actually watching.
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
      - "9997:9997"

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  minio_data:
